[build-system]
requires = ["setuptools>=64", "wheel", "ninja", "torch"]
build-backend = "setuptools.build_meta"

[project]
name = "cudalab"
version = "0.1.0"
description = "Learning CUDA: Python -> libtorch (C++) -> CUDA kernels"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["cudalab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
